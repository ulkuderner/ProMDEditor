name: MarkPad
options:
  bundleIdPrefix: com.caglar
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Arayuz dilleri: en taban, digerleri String Catalog'dan gelir.
knownRegions: [en, tr, de, es, fr, it, Base]

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown
    branch: main

settingGroups:
  common:
    base:
      SWIFT_VERSION: "5.9"
      SWIFT_EMIT_LOC_STRINGS: YES
      MARKETING_VERSION: "1.2"
      CURRENT_PROJECT_VERSION: "4"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
      SWIFT_EMIT_LOC_STRINGS: YES
      DEVELOPMENT_TEAM: W4A4C428H6

targets:
  MarkPad:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/KaTeX
        buildPhase: resources
    dependencies:
      - package: Markdown
        product: Markdown
      - target: MarkPadQuickLook
        embed: true
        codeSign: true
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: ProMDEditor
        PRODUCT_MODULE_NAME: MarkPad
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/MarkPad.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  MarkPadQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLook
        excludes: ["Info.plist", "*.entitlements"]
      - path: Sources/Shared
        excludes:
          - FormatMenus.swift
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: MarkPadQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad.QuickLook
        INFOPLIST_FILE: Sources/QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/QuickLook/QuickLook.entitlements
        GENERATE_INFOPLIST_FILE: NO

  MarkPadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MarkPadTests
    dependencies:
      - target: MarkPad
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad.Tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen TEST_HOST'u hedef adindan turetir; urun adi ProMDEditor oldugu
        # icin elle gecersiz kiliyoruz.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ProMDEditor.app/Contents/MacOS/ProMDEditor

  MarkPadIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
        excludes: ["Info.plist", "ScreenshotApp.swift"]
      - path: Sources/Shared/Theme.swift
      - path: Sources/Shared/AppSettings.swift
      - path: Sources/Shared/MarkdownHTMLRenderer.swift
      - path: Sources/Shared/FormatCommand.swift
      - path: Sources/Shared/MarkdownEditing.swift
      - path: Sources/Shared/MarkdownAugments.swift
      - path: Sources/Shared/KatexSupport.swift
      - path: Sources/Shared/FormatMenus.swift
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/KaTeX
        buildPhase: resources
    dependencies:
      - package: Markdown
        product: Markdown
      - target: MarkPadIOSQuickLook
        embed: true
      - target: MarkPadIOSShare
        embed: true
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: ProMDEditor
        PRODUCT_MODULE_NAME: MarkPadIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  MarkPadIOSQuickLook:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOSQuickLook
        excludes: ["Info.plist"]
      - path: Sources/iOS/FormattedMarkdown.swift
      - path: Sources/Shared/Theme.swift
      - path: Sources/Shared/AppSettings.swift
      - path: Sources/Shared/MarkdownHTMLRenderer.swift
      - path: Sources/Shared/FormatCommand.swift
      - path: Sources/Shared/MarkdownAugments.swift
      - path: Sources/Shared/KatexSupport.swift
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: MarkPadIOSQuickLook
        PRODUCT_MODULE_NAME: MarkPadIOSQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad.ReaderQuickLook
        INFOPLIST_FILE: Sources/iOSQuickLook/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  MarkPadIOSShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOSShare
        excludes: ["Info.plist"]
      - path: Sources/iOS/FormattedMarkdown.swift
      - path: Sources/Shared/Theme.swift
      - path: Sources/Shared/AppSettings.swift
      - path: Sources/Shared/MarkdownHTMLRenderer.swift
      - path: Sources/Shared/FormatCommand.swift
      - path: Sources/Shared/MarkdownAugments.swift
      - path: Sources/Shared/KatexSupport.swift
      - path: Resources/KaTeX
        buildPhase: resources
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: MarkPadIOSShare
        PRODUCT_MODULE_NAME: MarkPadIOSShare
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad.Share
        INFOPLIST_FILE: Sources/iOSShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  MarkPadIOSScreenshots:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
        excludes: ["Info.plist", "ReaderApp.swift"]
      - path: Sources/Shared/Theme.swift
      - path: Sources/Shared/AppSettings.swift
      - path: Sources/Shared/MarkdownHTMLRenderer.swift
      - path: Sources/Shared/FormatCommand.swift
      - path: Sources/Shared/MarkdownEditing.swift
      - path: Sources/Shared/MarkdownAugments.swift
      - path: Sources/Shared/KatexSupport.swift
      - path: Sources/Shared/FormatMenus.swift
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/KaTeX
        buildPhase: resources
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: ProMDEditor
        PRODUCT_MODULE_NAME: MarkPadIOSScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: com.caglar.MarkPad.screenshots
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

schemes:
  MarkPad:
    build:
      targets:
        MarkPad: all
        MarkPadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarkPadTests
    archive:
      config: Release
  MarkPadIOS:
    build:
      targets:
        MarkPadIOS: all
    run:
      config: Debug
    archive:
      config: Release
  MarkPadIOSScreenshots:
    build:
      targets:
        MarkPadIOSScreenshots: all
    run:
      config: Debug
