name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle ve kontrolleri calistir
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Xcode surumunu yaz
        run: xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Swift paketlerini onbellekle
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Projeyi uret
        run: xcodegen generate

      - name: Tema kontrastlarini dogrula
        # Esigin altinda tema kalirsa script 1 dondurur ve is basarisiz olur.
        run: python3 Tools/fix_contrast.py --check

      - name: Debug derleme
        run: |
          set -o pipefail
          xcodebuild -project MarkPad.xcodeproj -scheme MarkPad \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            build | xcpretty || xcodebuild -project MarkPad.xcodeproj \
            -scheme MarkPad -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" build

      - name: Paket icerigini dogrula
        run: |
          APP=.build/Build/Products/Debug/ProMDEditor.app
          fail() { echo "::error::$1"; exit 1; }

          test -d "$APP/Contents/PlugIns/MarkPadQuickLook.appex" \
            || fail "Quick Look eklentisi eksik"

          # App Store: ikon asset catalog'dan gelmeli (.icns'i actool uretir)
          test -f "$APP/Contents/Resources/Assets.car" || fail "Assets.car eksik"
          test "$(plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist")" = "AppIcon" \
            || fail "CFBundleIconName yanlis"
          xcrun assetutil --info "$APP/Contents/Resources/Assets.car" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); \
              sys.exit(0 if 1024 in {e.get('PixelWidth') for e in d} else 1)" \
            || fail "Asset catalog'da 1024x1024 ikon yok"

          # App Store: privacy manifest her iki pakette de bulunmali
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy" \
            || fail "Uygulama privacy manifest eksik"
          test -f "$APP/Contents/PlugIns/MarkPadQuickLook.appex/Contents/Resources/PrivacyInfo.xcprivacy" \
            || fail "Eklenti privacy manifest eksik"

          # App Store: sandbox zorunlu
          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | plutil -convert xml1 -o - - | grep -q "app-sandbox" \
            || fail "App Sandbox kapali"

          echo "Paket icerigi ve App Store gereksinimleri dogrulandi"
